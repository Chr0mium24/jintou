    text-align: center; pointer-events: none; user-select: none;
    font: 300 12px/1.6 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    letter-spacing: .4em; color: rgba(30, 32, 48, .5);
    opacity: 0; transition: opacity 1.2s ease, color 1.2s ease;
  }
  .hint.on { opacity: 1; }
  @media (max-width: 560px) { .hint { letter-spacing: .15em; padding: 0 1em; } }
  body.walking .hint { color: rgba(255, 255, 255, .62); }
  .meter {
    position: fixed; left: 16px; top: 13px; pointer-events: none; user-select: none;

  }
  .meter.on { opacity: 1; }
  #flash { position: fixed; inset: 0; background: #fffdf2; opacity: 0; pointer-events: none; }
  .back {
    position: fixed; right: 14px; top: 12px; padding: 8px 10px;
    background: none; border: 0; cursor: pointer;
    font: 300 12px/1 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    letter-spacing: .3em; color: rgba(255, 255, 255, .45);
    opacity: 0; pointer-events: none; transition: opacity .8s ease, color .3s;
  }
  body.walking .back { opacity: 1; pointer-events: auto; }
  .back:hover, .back:focus-visible { color: rgba(255, 255, 255, .9); outline: none; }
